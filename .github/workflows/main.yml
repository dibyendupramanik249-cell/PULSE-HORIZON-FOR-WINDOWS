name: Build Windows EXE

# Builds Pulse Horizon for Windows on GitHub's own Windows machines.
# Nothing runs on your PC. A power cut cannot stop it.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the EXE
        run: cargo tauri build

      - name: Upload the EXE
        uses: actions/upload-artifact@v4
        with:
          name: pulse-horizon-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/pulse-horizon.exe
