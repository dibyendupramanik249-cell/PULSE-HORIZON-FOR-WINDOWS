name: Build Windows EXE

# Builds Pulse Horizon for Windows on GitHub's own Windows machines.
# Nothing runs on your PC. A power cut cannot stop it.
#
# NOTE ON SPEED: this does NOT run "cargo install tauri-cli".
# That command COMPILES the Tauri CLI from source - hundreds of Rust
# crates - which is what made the first run crawl for 12 hours.
# The official action below ships the CLI already built, so it takes
# seconds instead of hours.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # This one step installs the CLI, builds the app and bundles the
      # installer. No compiling the tool itself.
      - name: Build the EXE
        uses: tauri-apps/tauri-action@v0

      - name: Upload the EXE
        uses: actions/upload-artifact@v4
        with:
          name: pulse-horizon-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/pulse-horizon.exe
