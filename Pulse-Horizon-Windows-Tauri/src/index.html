<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse Horizon</title>
<style>
/* ============================================================
   THE CHROME
   On Android this was Kotlin: a topBar LinearLayout, an EditText
   address bar, Buttons for the tab strip. On Windows it is this
   page. Same idea, same colours, and now it is HTML.
   ============================================================ */
:root{
  --bg:#020617; --surface:#0f172a; --surface2:#1e293b; --line:#1e293b;
  --accent:#22d3ee; --accent2:#0e7490; --text:#e2e8f0; --muted:#94a3b8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--surface);color:var(--text);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;user-select:none;
}
.strip{display:flex;gap:5px;padding:7px 8px 0;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{
  display:flex;align-items:center;gap:6px;font-size:11.5px;padding:6px 10px;
  border-radius:9px 9px 0 0;background:var(--surface2);color:var(--muted);
  white-space:nowrap;cursor:pointer;max-width:190px;flex:0 0 auto;
}
.chip.on{background:var(--bg);color:var(--text)}
.chip .t{overflow:hidden;text-overflow:ellipsis;max-width:130px}
.chip .x{opacity:.6;font-size:13px;line-height:1}
.chip .x:hover{opacity:1;color:#f87171}
.chip.add{font-weight:700;color:var(--text);padding:6px 12px;background:transparent}
.bar{display:flex;align-items:center;gap:6px;padding:6px 8px 8px;background:var(--bg)}
.ib{
  width:30px;height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  border-radius:8px;background:transparent;color:var(--text);font-size:15px;border:0;cursor:pointer;
}
.ib:hover{background:var(--surface2)}
.ib:disabled{opacity:.3;cursor:default}
.url{
  flex:1;height:32px;background:var(--surface2);border:1px solid transparent;border-radius:9px;
  color:var(--text);font-size:12.5px;padding:0 11px;outline:none;font-family:inherit;
}
.url:focus{border-color:var(--accent)}
.menu{
  position:fixed;top:74px;right:8px;width:250px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:6px;z-index:50;display:none;
  box-shadow:0 18px 40px -18px #000;
}
.menu.on{display:block}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;font-size:12.5px;cursor:pointer}
.mrow:hover{background:var(--surface2)}
.mrow .mi{width:16px;text-align:center;color:var(--accent)}
.mrow .mv{margin-left:auto;color:var(--muted);font-size:11px}
.sep{height:1px;background:var(--line);margin:5px 8px}

/* the pairing sheet - the PC SHOWS a code, the phone SCANS it */
.pair{position:fixed;inset:0;background:rgba(2,6,23,.82);display:none;align-items:center;justify-content:center;z-index:80}
.pair.on{display:flex}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;width:360px;text-align:center}
.pcard h3{margin:0 0 4px;font-size:15px}
.pcard .sub{color:var(--muted);font-size:11.5px;margin-bottom:16px}
.qrbox{background:#fff;border-radius:14px;padding:12px;display:inline-block;line-height:0}
.qrbox svg{width:240px;height:240px;display:block}
.pmeta{margin-top:14px;font-size:11.5px;color:var(--muted);line-height:1.7}
.pmeta b{color:var(--accent);font-family:ui-monospace,Consolas,monospace;letter-spacing:.12em;font-size:14px}
.pclose{margin-top:16px;padding:9px 18px;border-radius:10px;border:0;background:var(--accent2);color:#fff;font-size:12.5px;cursor:pointer;font-family:inherit}
.note{margin-top:10px;font-size:10.5px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
  <div class="strip" id="strip"></div>
  <div class="bar">
    <button class="ib" id="back"  title="Back">‹</button>
    <button class="ib" id="fwd"   title="Forward">›</button>
    <button class="ib" id="reload" title="Reload">⟳</button>
    <input class="url" id="url" placeholder="Search or type URL" spellcheck="false" autocomplete="off">
    <button class="ib" id="dots" title="Menu">⋮</button>
  </div>

  <div class="menu" id="menu">
    <div class="mrow" data-a="home"><span class="mi">⌂</span>Home</div>
    <div class="mrow" data-a="tabs"><span class="mi">▤</span>Open tabs<span class="mv" id="mTabs">1</span></div>
    <div class="sep"></div>
    <div class="mrow" data-a="reload"><span class="mi">⟳</span>Reload</div>
    <div class="mrow" data-a="outside"><span class="mi">↗</span>Open in your browser</div>
    <div class="sep"></div>
    <div class="mrow" data-a="pair"><span class="mi">▦</span>Pair a device<span class="mv">phone</span></div>
    <div class="sep"></div>
    <div class="mrow" data-a="settings"><span class="mi">⚙</span>Settings</div>
    <div class="mrow" data-a="about"><span class="mi">i</span>About Pulse Horizon</div>
  </div>

  <!-- PAIRING: this machine shows the code, the phone reads it -->
  <div class="pair" id="pair">
    <div class="pcard">
      <h3>Pair your phone</h3>
      <div class="sub">Point the phone's scanner at this code</div>
      <div class="qrbox" id="qrbox"></div>
      <div class="pmeta">
        This machine: <b id="pHost">—</b><br>
        Code: <b id="pToken">—</b>
      </div>
      <div class="note">There is no camera on this side. The phone does the scanning.</div>
      <button class="pclose" id="pClose">Close</button>
    </div>
  </div>

<script>
// Inside Tauri these are real. Opened as a plain file, they no-op, so the
// chrome can still be viewed and designed on its own.
const T = window.__TAURI__ || null;
const invoke = T ? T.core.invoke : async () => {};
const listen = T ? T.event.listen : () => {};

const HOME = 'home.html';
let tabs = [{ title: 'New tab', url: '' }];
let active = 0;

const $ = (id) => document.getElementById(id);

function titleOf(url){
  if (!url) return 'New tab';
  try { return url.replace(/^https?:\/\//,'').split('/')[0] || 'New tab'; } catch(e){ return 'New tab'; }
}

function renderTabs(){
  const s = $('strip'); s.innerHTML = '';
  tabs.forEach((t, i) => {
    const c = document.createElement('div');
    c.className = 'chip' + (i === active ? ' on' : '');
    c.innerHTML = '<span class="t"></span><span class="x">✕</span>';
    c.querySelector('.t').textContent = t.title;
    c.onclick = (e) => {
      if (e.target.classList.contains('x')) { closeTab(i); return; }
      switchTo(i);
    };
    s.appendChild(c);
  });
  const add = document.createElement('div');
  add.className = 'chip add'; add.textContent = '+';
  add.onclick = newTab;
  s.appendChild(add);
  $('mTabs').textContent = tabs.length;
}

function syncPage(){
  // push the tab list into the home page - the Windows phSetTabs
  const list = tabs.map((t, i) => ({ title: t.title, url: t.url, active: i === active }));
  invoke('page_eval', { js: 'try{ if (window.phSetTabs) phSetTabs(' + JSON.stringify(JSON.stringify(list)) + '); }catch(e){}' });
}

async function go(url){
  url = (url || '').trim();
  if (!url) { await invoke('set_url', { url: '' }); return; }
  if (!/^[a-z]+:\/\//i.test(url)) {
    url = url.includes('.') && !url.includes(' ')
      ? 'https://' + url
      : 'https://www.google.com/search?q=' + encodeURIComponent(url);
  }
  tabs[active] = { title: titleOf(url), url: url };
  renderTabs(); syncPage();
  await invoke('set_url', { url: url });
}

function switchTo(i){
  active = i;
  const u = tabs[i].url;
  renderTabs(); syncPage();
  invoke('set_url', { url: u || '' });
  $('url').value = u || '';
}

function newTab(){
  tabs.push({ title: 'New tab', url: '' });
  active = tabs.length - 1;
  renderTabs(); syncPage();
  invoke('set_url', { url: '' });
  $('url').value = '';
  $('url').focus();
}

function closeTab(i){
  if (tabs.length === 1) { tabs[0] = { title: 'New tab', url: '' }; active = 0; switchTo(0); return; }
  tabs.splice(i, 1);
  if (active >= tabs.length) active = tabs.length - 1;
  switchTo(active);
}

function closeAll(){
  tabs = [{ title: 'New tab', url: '' }];
  active = 0;
  switchTo(0);
}

/* ---------- wiring ---------- */
$('url').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { go($('url').value); $('url').blur(); }
});
$('back').onclick   = () => invoke('page_back');
$('fwd').onclick    = () => invoke('page_forward');
$('reload').onclick = () => invoke('page_reload');

$('dots').onclick = (e) => { e.stopPropagation(); $('menu').classList.toggle('on'); };
document.addEventListener('click', () => $('menu').classList.remove('on'));

document.querySelectorAll('.mrow').forEach((r) => {
  r.onclick = () => {
    const a = r.dataset.a;
    $('menu').classList.remove('on');
    if (a === 'home')     { switchTo(0); tabs[0] = { title:'New tab', url:'' }; switchTo(0); }
    if (a === 'reload')   invoke('page_reload');
    if (a === 'outside')  invoke('open_outside', { url: tabs[active].url || 'https://www.google.com' });
    if (a === 'settings') invoke('page_eval', { js: 'try{ if (window.showSettings) showSettings(); }catch(e){}' });
    if (a === 'about')    invoke('page_eval', { js: 'try{ showToast("Pulse Horizon for Windows"); }catch(e){}' });
    if (a === 'tabs')     invoke('page_eval', { js: 'try{ openTabSwitcher(); }catch(e){}' });
    if (a === 'pair')     showPair();
  };
});

/* ---------- pairing: show the code ---------- */
async function showPair(){
  $('pair').classList.add('on');
  try {
    const info = await invoke('pair_info');
    $('qrbox').innerHTML = info.svg;
    $('pHost').textContent = info.host;
    $('pToken').textContent = info.token;
  } catch (e) {
    $('qrbox').innerHTML = '<div style="width:240px;height:240px;display:flex;align-items:center;justify-content:center;color:#334155;font-size:12px">code unavailable</div>';
  }
}
$('pClose').onclick = () => $('pair').classList.remove('on');

/* the page asks the browser to do things with pulse:// links */
listen('pulse', (ev) => {
  const u = ev.payload || '';
  if (u.startsWith('pulse://tab/'))      switchTo(parseInt(u.slice(12), 10) || 0);
  else if (u.startsWith('pulse://closetab/')) closeTab(parseInt(u.slice(17), 10) || 0);
  else if (u.startsWith('pulse://closeall'))  closeAll();
  else if (u.startsWith('pulse://newtab'))    newTab();
});

/* keep the address bar honest */
setInterval(async () => {
  try {
    const u = await invoke('page_url');
    if (u && !u.startsWith('tauri://') && u !== tabs[active].url) {
      tabs[active] = { title: titleOf(u), url: u };
      $('url').value = u;
      renderTabs(); syncPage();
    }
  } catch(e) {}
}, 700);

renderTabs();
$('url').focus();
</script>
</body>
</html>
